  # Probe and Actuators
  sefa-probe:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-probe:${ARCH:-amd64}
    container_name: sefa-probe
    hostname: sefa-probe
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-probe
    ports:
      - "58020:58020"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:58020/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  sefa-instances-manager:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-instances-manager:${ARCH:-amd64}
    container_name: sefa-instances-manager
    hostname: sefa-instances-manager
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-instances-manager
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Required for Docker socket exposure
    # NOTE: You must expose Docker daemon on tcp://localhost:2375 for this service to work (see SETUP_ICSE_PERSONALE.sh)
    ports:
      - "58015:58015"

  sefa-config-manager:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-config-manager:${ARCH:-amd64}
    container_name: sefa-config-manager
    hostname: sefa-config-manager
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-config-manager
    environment:
      - GITHUB_OAUTH=${GITHUB_OAUTH}
      - GITHUB_REPOSITORY_URL=${GITHUB_REPOSITORY_URL}
    ports:
      - "58016:58016"

  # RAMSES Services
  ramses-knowledge:
    image: ${IMAGE_REGISTRY:-giamburrasca}/ramses-knowledge:${ARCH:-amd64}
    container_name: ramses-knowledge
    hostname: ramses-knowledge
    depends_on: # all sefa services defined in system architecture of knowledge needs to be registered to eureka before knowledge is started
      mysql:
        condition: service_healthy
      sefa-probe:
        condition: service_healthy
      sefa-restaurant-service:
        condition: service_healthy
      sefa-ordering-service:
        condition: service_healthy
      sefa-payment-proxy-1-service:
        condition: service_healthy
      sefa-delivery-proxy-1-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:58005/rest/activeModule"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 200s
    networks:
      ramses-sas-net:
        aliases:
          - ramses-knowledge
    ports:
      - "58005:58005"
    environment:
      - EUREKA_IP_PORT=sefa-eureka:58082
      - CONFIG_SERVER_IP_PORT=sefa-configserver:8888

  ramses-monitor:
    image: ${IMAGE_REGISTRY:-giamburrasca}/ramses-monitor:${ARCH:-amd64}
    container_name: ramses-monitor
    hostname: ramses-monitor
    networks:
      ramses-sas-net:
        aliases:
          - ramses-monitor
    ports:
      - "58001:58001"
    depends_on:
      ramses-knowledge:
        condition: service_healthy
    environment:
      - KNOWLEDGE_URL=http://ramses-knowledge:58005
      - EUREKA_IP_PORT=sefa-eureka:58082
      - CONFIG_SERVER_IP_PORT=sefa-configserver:8888

  ramses-analyse:
    image: ${IMAGE_REGISTRY:-giamburrasca}/ramses-analyse:${ARCH:-amd64}
    container_name: ramses-analyse
    hostname: ramses-analyse
    networks:
      ramses-sas-net:
        aliases:
          - ramses-analyse
    ports:
      - "58002:58002"
    depends_on:
      ramses-knowledge:
        condition: service_healthy
    environment:
      - KNOWLEDGE_URL=http://ramses-knowledge:58005
      - EUREKA_IP_PORT=sefa-eureka:58082
      - CONFIG_SERVER_IP_PORT=sefa-configserver:8888

  ramses-execute:
    image: ${IMAGE_REGISTRY:-giamburrasca}/ramses-execute:${ARCH:-amd64}
    container_name: ramses-execute
    hostname: ramses-execute
    networks:
      ramses-sas-net:
        aliases:
          - ramses-execute
    ports:
      - "58004:58004"
    depends_on:
      ramses-knowledge:
        condition: service_healthy
    environment:
      - KNOWLEDGE_URL=http://ramses-knowledge:58005
      - MONITOR_URL=http://ramses-monitor:58001
      - INSTANCES_MANAGER_ACTUATOR_URL=http://sefa-instances-manager:58015
      - CONFIG_MANAGER_ACTUATOR_URL=http://sefa-config-manager:58016
      - EUREKA_IP_PORT=sefa-eureka:58082
      - CONFIG_SERVER_IP_PORT=sefa-configserver:8888

  ramses-dashboard:
    image: ${IMAGE_REGISTRY:-giamburrasca}/ramses-dashboard:${ARCH:-amd64}
    container_name: ramses-dashboard
    hostname: ramses-dashboard
    networks:
      ramses-sas-net:
        aliases:
          - ramses-dashboard
    ports:
      - "58000:58000"
    depends_on:
      ramses-knowledge:
        condition: service_healthy
    environment:
      - KNOWLEDGE_URL=http://ramses-knowledge:58005
      - EUREKA_IP_PORT=sefa-eureka:58082
      - CONFIG_SERVER_IP_PORT=sefa-configserver:8888

  ramses-plan:
    image: ${IMAGE_REGISTRY:-giamburrasca}/ramses-plan:arm64
    container_name: ramses-plan
    hostname: ramses-plan
    networks:
      ramses-sas-net:
        aliases:
          - ramses-plan
    ports:
      - "58003:58003"
    depends_on:
      ramses-knowledge:
        condition: service_healthy
    environment:
      - KNOWLEDGE_URL=http://ramses-knowledge:58005
      - EXECUTE_URL=http://ramses-execute:58004
      - EUREKA_IP_PORT=sefa-eureka:58082
      - CONFIG_SERVER_IP_PORT=sefa-configserver:8888

  # Load Generator (required for RAMSES availability metrics)
  sefa-load-generator:
    image: sbi98/sefa-load-generator:arm64 # there is no amd64 version of the load generator image
    container_name: sefa-load-generator
    hostname: sefa-load-generator
    depends_on:
      sefa-web-service:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-load-generator

networks:
  ramses-sas-net:
    name: ramses-sas-net #necessary, otherwise compose will create a new network with prefix "ramses-reusability", which will cause issues with the network name running the simulation
    external: true 