  # sefa-delivery-proxy-2-service:
  #   image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-delivery-proxy-2-service:${ARCH:-amd64}
  #   depends_on:
  #     sefa-eureka:
  #       condition: service_healthy
  #     sefa-configserver:
  #       condition: service_healthy
  #   networks:
  #     ramses-sas-net:
  #       aliases:
  #         - sefa-delivery-proxy-2-service
  #         - DELIVERY-PROXY-2-SERVICE
  #   ports:
  #     - "58096:58096"
  #   # Healthcheck: By curling Eureka, we ensure the service is not only healthy but also ready (registered in Eureka)
  #   healthcheck:
  #     test: ["CMD", "sh", "-c", "curl -sf http://sefa-eureka:58082/eureka/apps/DELIVERY-PROXY-SERVICE | grep '<application>'"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  # sefa-payment-proxy-3-service:
  #   image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-payment-proxy-3-service:${ARCH:-amd64}
  #   depends_on:
  #     sefa-eureka:
