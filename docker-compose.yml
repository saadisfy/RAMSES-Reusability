name: ramses

# Add this variable at the top for easy registry switching
x-image-registry: &image-registry ${IMAGE_REGISTRY:-giamburrasca}

# The services are organized with proper dependencies:
# - MySQL is started first
# - Eureka server depends on MySQL
# - Config server depends on Eureka
# - All other services depend on both Config server and Eureka

services:
  # MySQL Service
  mysql:
    image: ${IMAGE_REGISTRY:-giamburrasca}/mysql:${ARCH:-amd64}
    container_name: mysql
    hostname: mysql
    networks:
      ramses-sas-net:
        aliases:
          - mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SEFA Services
  #NOTE: there is no amd64 version of the eureka image, so we need to use the arm64 version
  #TODO: Create image for amd64 if neceessary
  sefa-eureka:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-eureka:arm64
    container_name: sefa-eureka
    hostname: sefa-eureka
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-eureka
    ports:
      - "58082:58082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:58082/"]
      interval: 10s 
      timeout: 10s
      retries: 10
      start_period: 200s

  #NOTE: there is no amd64 version of the configserver image, so we need to use the arm64 version
  #TODO: Create image for amd64 if neceessary
  sefa-configserver:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-configserver:arm64
    container_name: sefa-configserver
    hostname: sefa-configserver
    depends_on:
      sefa-eureka:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-configserver
    environment:
      - GITHUB_REPOSITORY_URL=${GITHUB_REPOSITORY_URL}
    ports:
      - "58888:58888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:58888/actuator/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 100s

  sefa-restaurant-service:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-restaurant-service:${ARCH:-amd64}
    container_name: sefa-restaurant-service
    hostname: sefa-restaurant-service
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-restaurant-service
          - RESTAURANT-SERVICE
    ports:
      - "58085:58085"
    # Healthcheck: By curling Eureka, we ensure the service is not only healthy but also ready (registered in Eureka)
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://sefa-eureka:58082/eureka/apps/RESTAURANT-SERVICE | grep '<application>'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sefa-ordering-service:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-ordering-service:${ARCH:-amd64}
    container_name: sefa-ordering-service
    hostname: sefa-ordering-service
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-ordering-service
          - ORDERING-SERVICE
    ports:
      - "58086:58086"
    # Healthcheck: By curling Eureka, we ensure the service is not only healthy but also ready (registered in Eureka)
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://sefa-eureka:58082/eureka/apps/ORDERING-SERVICE | grep '<application>'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Only one payment and delivery proxy can be active for RAMSES knowledge initialization
  sefa-payment-proxy-1-service:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-payment-proxy-1-service:${ARCH:-amd64}
    container_name: sefa-payment-proxy-1-service
    hostname: sefa-payment-proxy-1-service
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-payment-proxy-1-service
          - PAYMENT-PROXY-1-SERVICE
    ports:
      - "58090:58090"
    # Healthcheck: By curling Eureka, we ensure the service is not only healthy but also ready (registered in Eureka)
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://sefa-eureka:58082/eureka/apps/PAYMENT-PROXY-SERVICE | grep '<application>'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sefa-delivery-proxy-1-service:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-delivery-proxy-1-service:${ARCH:-amd64}
    container_name: sefa-delivery-proxy-1-service
    hostname: sefa-delivery-proxy-1-service
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-delivery-proxy-1-service
          - DELIVERY-PROXY-1-SERVICE
    ports:
      - "58095:58095"
    # Healthcheck: By curling Eureka, we ensure the service is not only healthy but also ready (registered in Eureka)
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://sefa-eureka:58082/eureka/apps/DELIVERY-PROXY-SERVICE | grep '<application>'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sefa-web-service:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-web-service:${ARCH:-amd64}
    container_name: sefa-web-service
    hostname: sefa-web-service
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-web-service
          - WEB-SERVICE
    ports:
      - "58080:58080"
    # Healthcheck: Web service doesn't register with Eureka, so check the service directly
    healthcheck:
      test: ["CMD", "sh", "-c", "curl --fail --silent http://localhost:58080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sefa-api-gateway:
    image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-api-gateway:${ARCH:-amd64}
    container_name: sefa-api-gateway
    hostname: sefa-api-gateway
    depends_on:
      sefa-eureka:
        condition: service_healthy
      sefa-configserver:
        condition: service_healthy
    networks:
      ramses-sas-net:
        aliases:
          - sefa-api-gateway
          - API-GATEWAY-SERVICE
    ports:
      - "58081:58081"
    # Healthcheck: By curling Eureka, we ensure the service is not only healthy but also ready (registered in Eureka)
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://sefa-eureka:58082/eureka/apps/API-GATEWAY-SERVICE | grep '<application>'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Additional proxy services
  # sefa-payment-proxy-2-service:
  #   image: ${IMAGE_REGISTRY:-giamburrasca}/sefa-payment-proxy-2-service:${ARCH:-amd64}
  #   depends_on:
